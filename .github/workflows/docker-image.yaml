name: docker-image

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/Dockerfile'
      - 'Project.toml'
      - 'exercise*/**'
      - 'utils/**'
      - '.github/workflows/docker-image.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: epfl-enac/change-tethyschloris-notebooks

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.TETHYSCHLORIS_PAT }}

      - name: Verify submodule content
        run: |
          if [ -z "$(ls -A TethysChloris.jl/src 2>/dev/null)" ]; then
            echo "::error::TethysChloris.jl submodule is empty — checkout failed to fetch it. Check the PAT and its scope on CHANGE-EPFL/TethysChloris.jl."
            exit 1
          fi
          echo "Submodule OK: $(ls TethysChloris.jl/src | wc -l) files in src/"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
